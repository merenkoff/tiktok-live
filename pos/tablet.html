<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Планшет офіціанта</title>
    <!-- No web-font stylesheet request: Inter is bundled (styles/fonts.css) and
         precached, because a request that black-holes without a network would
         hold the first paint, and the tablet's whole point is opening without one. -->
    <link rel="manifest" href="/tablet.webmanifest" />
    <meta name="theme-color" content="#f2f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Планшет" />
    <link rel="apple-touch-icon" href="/icons/tablet-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tablet-main.tsx"></script>
  </body>
</html>
