<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Планшет офіціанта</title>
    <!-- No Google Fonts here, unlike index.html: a stylesheet request that
         black-holes without a network holds the first paint, and the tablet's
         whole point is opening without one. `--pos-font` falls back to
         system-ui (styles/tokens.css). -->
    <link rel="manifest" href="/tablet.webmanifest" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Планшет" />
    <link rel="apple-touch-icon" href="/icons/tablet-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tablet-main.tsx"></script>
  </body>
</html>
