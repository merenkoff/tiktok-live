[package]
name = "cloth-pos"
version = "1.0.0"
description = "Cloth POS cashier desktop shell"
authors = ["you"]
edition = "2021"

[lib]
name = "cloth_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
