[package]
name = "cloth-pos"
version = "1.0.3"
description = "Cloth POS cashier desktop shell"
authors = ["Serhii Merenkov / Technologies LLC <mer.sergei@gmail.com>"]
edition = "2021"
license-file = "../../LICENSE"
publish = false

[lib]
name = "cloth_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
escpos = "0.19.0"
printers = "2.3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
