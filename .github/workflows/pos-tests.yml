name: POS tests

on:
  push:
    branches: [main]
    paths:
      - 'pos/**'
      - '.github/workflows/pos-tests.yml'
  pull_request:
    paths:
      - 'pos/**'
      - '.github/workflows/pos-tests.yml'

jobs:
  unit:
    name: Unit + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:platform-boundary
      - run: npm run check:tauri-capabilities
      - run: npm run test:coverage

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The rewrites production's `serve@14` applies to dist/ — Playwright runs
      # against `vite preview`, which only imitates them (POS_PWA.md §3).
      - run: npm run check:serve-json
