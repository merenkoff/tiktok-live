name: POS Release

# Two ways in, one behaviour:
#   * Actions -> "POS Release" -> Run workflow, pick patch/minor/major (or type
#     an explicit version). CI computes the number.
#   * git push a `pos-v1.2.3` tag. CI takes the number from the tag.
# Either way CI writes the version into pos/package.json, tauri.conf.json,
# Cargo.toml and Cargo.lock, commits that to main, (re)points the tag at that
# commit, then builds every platform and attaches the installers to a GitHub
# Release for the tag. Nothing to bump or commit by hand.
#
# Release notes: if `.github/releases/<tag>.md` exists (e.g.
# `.github/releases/pos-v2.3.0.md`), it becomes the Release body AND the
# message of an annotated tag — so the notes are reviewed in the PR that
# ships them and `git show pos-v2.3.0` reads the same text people see. Without
# the file the tag stays lightweight and the body is the placeholder below.
# Either way the Release is created as a draft; publishing is a human's tap.
#
# Open-core (TechDocs/POS_OPENCORE.md §11): once the sources live in a private
# monorepo and this repository is its exported mirror, the two halves of this
# workflow run in different places. The Actions variable RELEASE_ROLE says
# which half a repository does:
#   * unset    — everything here, as described above (a fork, or this
#                repository before the split);
#   * `source` — the private monorepo: bump, commit, tag, then EXPORT the commit
#                and the tag to the mirror. No installers are built there — the
#                macOS and Windows runners are what a private repository pays
#                most for, and the desktop app holds no private code;
#   * `mirror` — the public repository: the exported `pos-v*` tag arrives as a
#                push and starts this workflow, which builds the installers from
#                that tag and drafts the Release. It never commits and never
#                moves a tag: `main` and the tags there belong to the export.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch | minor | major, or an explicit version like 1.2.3'
        required: true
        default: patch
  push:
    tags:
      - 'pos-v*'

permissions:
  contents: write

concurrency:
  group: pos-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      - name: A release starts in the source repository
        if: vars.RELEASE_ROLE == 'mirror' && github.event_name != 'push'
        run: |
          echo "::error::This repository is the exported mirror. Run «POS Release» in the source repository: it bumps the version, and the export brings the commit and the pos-v tag here, which starts this workflow to build the installers." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          # The mirror builds the tag exactly as it was exported; everywhere
          # else the bump is committed on top of main.
          ref: ${{ vars.RELEASE_ROLE == 'mirror' && github.ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version + write manifests
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            arg="${GITHUB_REF_NAME#pos-v}"
          else
            arg="${{ inputs.bump }}"
          fi
          version="$(node .github/scripts/set-pos-version.mjs "$arg")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=pos-v$version"  >> "$GITHUB_OUTPUT"
          echo "Releasing pos-v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Release notes
        id: notes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          notes=".github/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            echo "notes=$notes" >> "$GITHUB_OUTPUT"
            echo "Release notes from $notes" >> "$GITHUB_STEP_SUMMARY"
            body="$(cat "$notes")"
          else
            echo "No $notes — placeholder body, lightweight tag" >> "$GITHUB_STEP_SUMMARY"
            # Placeholder until the notes are written by hand. The body is
            # user-facing twice over: on the release page, and inside the
            # cashier itself — HardwarePage shows the first lines of it as the
            # update notes — so it is in the same language as the app.
            body="$(printf '%s\n' \
              'Оновлення десктопної каси LiveShop POS.' \
              '' \
              'Збірка без підпису Apple/Microsoft — на першому запуску система може показати попередження.' \
              'Встановлення на macOS однією командою, без попереджень:' \
              'curl -fsSL https://raw.githubusercontent.com/merenkoff/tiktok-live/main/pos/scripts/install-macos.sh | bash')"
          fi
          {
            echo "body<<__RELEASE_BODY__"
            echo "$body"
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Commit bump + (re)point tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
          ROLE: ${{ vars.RELEASE_ROLE }}
        run: |
          set -euo pipefail
          if [ "${ROLE}" = "mirror" ]; then
            # The exported tag already carries the bump. A difference here
            # means the tag was not made by the source's POS Release.
            if ! git diff --quiet; then
              echo "::error::${TAG} does not carry its own version in the manifests — the mirror never commits; release from the source repository." >&2
              git diff --stat >&2
              exit 1
            fi
            echo "Mirror: building ${TAG} as exported — no commit, the tag stays where it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add pos/package.json pos/src-tauri/tauri.conf.json \
                    pos/src-tauri/Cargo.toml pos/src-tauri/Cargo.lock
            git commit -m "chore(pos): release ${TAG} [skip ci]"
            git push origin HEAD:main
          else
            echo "Manifests already at this version — no bump commit."
          fi
          # Tag the exact commit the installers are built from. Its message
          # carries [skip ci], so this (force-)push does not retrigger anything.
          # With release notes in the repo the tag is annotated with them.
          if [ -n "${NOTES}" ]; then
            git tag -f -a "${TAG}" -F "${NOTES}"
          else
            git tag -f "${TAG}"
          fi
          git push -f origin "${TAG}"

  # Source role only: the bump commit and its tag were pushed with GITHUB_TOKEN,
  # which starts no other workflow — so the export that carries them to the
  # mirror is a job of this one. Same steps and the same concurrency group as
  # the export job of export-public.yml.
  export:
    name: Export the release to the mirror
    needs: version
    if: vars.RELEASE_ROLE == 'source'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: export-public
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay main and the release tag onto the mirror
        env:
          PUBLIC_EXPORT_KEY: ${{ secrets.PUBLIC_EXPORT_KEY }}
        run: bash scripts/export-public/ci-sync.sh

  release:
    needs: version
    # Installers are built where the runners are free: in a fork or before the
    # split (role unset), and in the mirror — never in the private source.
    if: vars.RELEASE_ROLE != 'source'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libcups2-dev

      - name: Install POS frontend deps
        working-directory: pos
        run: npm ci

      # In-app update (macOS .app.tar.gz, Linux AppImage) needs signed updater
      # artifacts plus a latest.json manifest. Both are switched on only once
      # TAURI_SIGNING_PRIVATE_KEY exists, so a repo without the secret keeps
      # producing exactly the installers it produced before. Windows stays out:
      # its NSIS updater path wants a code-signed installer we don't have.
      #
      # The check runs as a step output because the `secrets` context is not
      # available in a step's `if:` — reading it there makes the whole workflow
      # file invalid, which GitHub reports as a startup failure with no logs.
      - name: Is the updater signing key configured?
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ "$RUNNER_OS" != "Windows" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable updater artifacts
        if: steps.signing.outputs.enabled == 'true'
        run: node -e "const f='pos/src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: pos
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: 'LiveShop POS v${{ needs.version.outputs.version }}'
          # `.github/releases/<tag>.md` when it exists, else the placeholder —
          # resolved by the `version` job above.
          releaseBody: ${{ needs.version.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.enabled == 'true' }}
          args: ${{ matrix.args }}
