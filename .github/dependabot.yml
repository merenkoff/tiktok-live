# Dependabot version updates.
#
# Security updates are a separate, repo-wide switch in Settings → Code security;
# they are not configured here and deliberately cover every manifest, including
# the ones this file leaves on a slow schedule.
#
# Two decisions worth knowing before editing:
#
#  * Majors are ignored everywhere — for VERSION updates. The three SPAs
#    (admin/, pos/, site/) sit on one deliberately aligned stack — React 18,
#    Vite 8, eslint 8 with the legacy .eslintrc.* setup, @typescript-eslint 8,
#    and Tailwind 3 in pos/ and site/ — so React 19, Tailwind 4 or eslint 9 is
#    a coordinated migration across three package.json files, not something
#    to merge from a bot PR. Do those by hand, all apps at once.
#
#    A SECURITY update does not read `update-types` (the options reference:
#    it "only affects version updates, not security updates"), so when the
#    only non-vulnerable release of a dependency sits behind a major of its
#    parent, the bot proposes that major anyway. That is how the build-time
#    postcss-selector-parser alert arrived as Tailwind 3 → 4: #221 for admin/
#    (merged into the retired app, where nothing signs in and CI checks no
#    styling) and #230 for pos/ (closed: the build fails, because the module
#    remotes compile their CSS through Tailwind's PostCSS plugin, which v4
#    moved to another package). What a security update DOES honour is
#    `dependency-name` + `versions`, so a major that must not arrive this way
#    gets an explicit `versions` ignore in its block — `tailwindcss` below.
#
#  * Nothing here auto-merges. module-release.yml signs module bundles with the
#    production Ed25519 key, so a compromised release of any dependency that
#    landed unattended would end up inside a signed artifact.
#
version: 2
updates:
  # ── GitHub Actions ───────────────────────────────────────────────────────
  # Majors are ignored here for a reason specific to this repo, learnt the hard
  # way on the first run: it proposed checkout 4->7, setup-node 4->7, cache 4->6
  # and tauri-action 0->1 in one PR, touching pos-release.yml and
  # module-release.yml. Those two only fire on a tag, so such a PR goes green
  # without them ever running and the breakage surfaces mid-release — with
  # tauri-action that means the signed bundle step.
  #
  # So: patches and minors ride along automatically, majors are a deliberate
  # change. Bump them by hand in the CI-covered workflows first (a PR there is
  # genuinely tested), then the release ones, verifying with a workflow_dispatch
  # run before tagging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # ── Backend (src/) ───────────────────────────────────────────────────────
  # backend-tests.yml lists package.json/package-lock.json in its paths filter,
  # so these PRs get typecheck + lint + the full vitest suite against Postgres.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # ── Frontends: admin/, pos/, site/ ───────────────────────────────────────
  # One PR per directory per week. Each is covered by its own workflow
  # (admin-tests, pos-tests, site-build) via the `<dir>/**` path filter.
  - package-ecosystem: npm
    directories:
      - /admin
      - /pos
      - /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # A 0.x package breaks on a "minor": dependabot counts 0.4 -> 0.5 as
      # minor, so the rule above does not catch it. 0.5 needs eslint 9 (peer
      # ^9 || ^10) and broke `npm ci` in admin/ and pos/ (PR #166). Drop this
      # together with the eslint 9 migration.
      - dependency-name: eslint-plugin-react-refresh
        versions: ['>=0.5.0']
      # Tailwind 4 is the by-hand migration from the header, but a security
      # update ignores `update-types`, and the only non-vulnerable release of
      # postcss-selector-parser (GHSA-rj75-hqrm-r3gf, build-time only) sits
      # behind it, so the bot proposed the major anyway: #221 for admin/, #230
      # for pos/. A `versions` condition is what security updates do honour.
      # It also stops 4.x updates for admin/, which took #221 — the retired
      # app, so nothing is lost. Drop this with the Tailwind 4 migration; until
      # then the alert is dismissed by hand in Security → Dependabot
      # ("vulnerable code is not actually used": Tailwind 3 runs only at build
      # time, over this repository's own CSS and content globs).
      - dependency-name: tailwindcss
        versions: ['>=4']

  # ── Tauri desktop shell (Rust) ───────────────────────────────────────────
  # tauri-check.yml compiles the crate on any change under pos/src-tauri/, so
  # these PRs get a real answer. Without it the green tick would come from
  # pos-tests.yml, which matches `pos/**` but never invokes cargo.
  - package-ecosystem: cargo
    directory: /pos/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
